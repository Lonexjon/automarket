name: Data pipeline (ingest + extract + dedupe + deal_score)

# Полный цикл сбора и анализа: новые посты из Telegram -> разбор regex'ом ->
# дедуп повторов -> пересчёт deal_score -> проверка целостности. Раз в 6
# часов (совпадает с текстом на сайте "обновляется каждые 6 часов", см.
# web/app.js loadStats). Фото обновляются отдельным расписанием
# (refresh_photos.yml, каждые 12ч) -- не смешиваем, чтобы одна долгая задача
# не задерживала другую на единственном self-hosted раннере.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: self-hosted
    steps:
      - name: Собрать новые посты из Telegram
        run: |
          cd ~/automarket
          source .venv/bin/activate
          python3 parsers/telegram_ingest.py

      - name: Разобрать regex'ом
        run: |
          cd ~/automarket
          source .venv/bin/activate
          python3 parsers/regex_extract.py

      - name: Дедуп повторов
        run: |
          cd ~/automarket
          source .venv/bin/activate
          python3 tools/dedupe.py

      - name: Пересчитать deal_score
        run: |
          cd ~/automarket
          source .venv/bin/activate
          python3 tools/deal_score.py

      - name: Проверка целостности базы
        run: |
          cd ~/automarket
          source .venv/bin/activate
          python3 tools/health_check.py || true
          # || true -- находки не должны валить пайплайн, это отдельная
          # забота о качестве данных, не о работоспособности сбора
