name: Exec (dev remote command)
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Команда/скрипт для bash (многострочный ок)"
        required: true

jobs:
  exec:
    runs-on: self-hosted
    steps:
      - name: Выполнить команду
        env:
          CMD_TEXT: ${{ inputs.cmd }}
        run: |
          cd ~/automarket
          printf '%s\n' "$CMD_TEXT" > /tmp/exec_cmd.sh
          echo "--- cmd ---"
          cat /tmp/exec_cmd.sh
          echo "--- output ---"
          bash /tmp/exec_cmd.sh
          rm -f /tmp/exec_cmd.sh
