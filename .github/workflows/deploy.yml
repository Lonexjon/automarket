name: Deploy to VPS

# Работает на self-hosted runner, который постоянно живёт на самом VPS --
# так что этот job выполняется прямо на сервере, без отдельного checkout
# (репозиторий там уже есть, живой каталог с automarket.db). Отдельный
# actions/checkout только запутал бы всё вторым, независимым клоном.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Обновить код
        run: |
          cd ~/automarket
          git fetch origin main
          git reset --hard origin/main

      - name: Установить зависимости
        run: |
          cd ~/automarket
          source .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Проверка целостности базы
        run: |
          cd ~/automarket
          source .venv/bin/activate
          python3 tools/health_check.py || true
          # || true -- находки не должны блокировать деплой кода, это
          # отдельная забота о качестве данных, не о работоспособности сайта

      - name: Перезапустить API
        run: systemctl restart automarket-api

      - name: Проверить, что сайт отвечает
        run: |
          sleep 2
          curl -sf http://localhost:8000/v1/listings?page_size=1 > /dev/null
